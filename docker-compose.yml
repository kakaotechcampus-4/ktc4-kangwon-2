services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ssuksak
      # 비밀번호만 .env 에서 받는다. 기본값을 두면 저장소에 비밀번호가 남고
      # 아무도 .env 를 만들지 않는다. 없으면 기동 전에 멈춘다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 가 없다 — cp .env.example .env 후 값을 채운다}
      POSTGRES_DB: ssuksak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssuksak -d ssuksak"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # 맥락이 뿌리다 — 이미지가 p0-planning 도 같이 담아야 한다(backend/Dockerfile).
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      # DATABASE_URL 안에도 비밀번호가 들어 있어 기본값을 두지 않는다.
      # .env 의 POSTGRES_PASSWORD 와 여기 비밀번호는 같은 값이어야 한다.
      DATABASE_URL: ${DATABASE_URL:?.env 가 없다 — cp .env.example .env 후 값을 채운다}
      # 없으면 backend 가 기동 시점에 죽는다. .env 에 반드시 있어야 한다.
      SECRET_KEY: ${SECRET_KEY:?.env 에 SECRET_KEY 가 없다 — python -c \"import secrets; print(secrets.token_urlsafe(48))\"}
      ELICE_MLAPI_BASE_URL: ${ELICE_MLAPI_BASE_URL:-}
      ELICE_MLAPI_API_KEY: ${ELICE_MLAPI_API_KEY:-}
      # 트렌드 수집 (ADR-016). 주 1회 작업에서만 쓴다 — 없으면 그 소스만 건너뛰므로
      # SECRET_KEY 와 달리 기동을 막지 않는다.
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      LIBRARY_AUTH_KEY: ${LIBRARY_AUTH_KEY:-}
      LLM_MODE: ${LLM_MODE:-mock}
      IS_SERVER: ${IS_SERVER:-0}
    # 예상 못 한 오류 로그(#100)가 재배포 때 사라지지 않게 디스크에 남긴다.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5" 
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"

  # 서버의 유일한 입구. 보안그룹에서 80 만 열고 8000 · 3000 은 닫는다.
  # 업로드 크기 제한이 여기 있다 — 앱보다 앞에서 끊어야 메모리·대역폭이 안 샌다.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/app-routes.conf:/etc/nginx/app-routes.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # 인증서는 60일마다 바뀐다. 바뀐 것을 읽으려면 nginx 를 다시 읽혀야 한다.
    # 6시간마다 reload — 접속을 끊지 않는다.
    command: >-
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    depends_on:
      - backend
      - frontend

  # 인증서 갱신. 12시간마다 보고 만료 30일 전부터 갱신한다.
  # 발급(처음 한 번)은 scripts/https-setup.sh 가 한다.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >-
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  pgdata:
  certbot-etc:
  certbot-www:

# 대역을 못 박는다. 안 박으면 도커가 빈 곳을 골라 써서 사람마다 172.18 · 172.19 … 로 다르고,
# 그러면 nginx 의 `allow` 에 적을 주소를 하나로 정할 수 없다. 172.16/12 전체를 여는 것과
# 게이트웨이 하나만 여는 것의 차이다.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
