# 리버스 프록시. 서버의 유일한 입구다.
# 보안그룹에서 80 만 열고 8000 · 3000 은 닫는다 — 그래야 이 파일이 실제 방어선이 된다.

events {}

http {
  # 업로드 크기 제한. 앱보다 앞에서 끊는다.
  # 실측: 충청북도 계획안 23개 중 최대 3.6MB(스캔 PDF) · 평균 0.3MB. 약 3배 여유.
  # 값을 바꾸면 backend 쪽 한도도 같이 맞춘다 — 다르면 안내 문구가 안 보인다.
  client_max_body_size 10m;

  # 파싱이 수 초 걸린다. 기본 60초로는 큰 양식에서 끊긴다.
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  # 프록시를 거치면 앱이 보는 IP 가 nginx 가 된다. 원래 값을 헤더로 넘긴다.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  server {
    listen 80;
    server_name _;

    # 배포 판정. deploy.yml 이 이 경로를 본다.
    location /health {
      proxy_pass http://backend:8000;
    }

    # /api 아래 이 두 개만 Next Route Handler 다 (app/api/assistant,
    # app/api/templates/extract). 아래 `location /api/` 가 전부 FastAPI 로 보내면
    # 배포에서만 404 가 난다 — 로컬 next dev 는 nginx 를 거치지 않아 드러나지 않는다.
    # `=` 는 정확히 그 경로일 때만 잡는다. 접두사로 잡으면 나중에 FastAPI 가 쓸 수도 있는
    # /api/templates/... 를 조용히 가로챈다. **Next 에 API route 를 추가하면 한 줄 늘린다.**
    location = /api/assistant {
      proxy_pass http://frontend:3000;
    }
    location = /api/templates/extract {
      proxy_pass http://frontend:3000;
    }

    # 나머지 /api 는 전부 FastAPI 다 (main.py: forms · centers · children).
    location /api/ {
      proxy_pass http://backend:8000;
    }

    location /docs {
      proxy_pass http://backend:8000;
    }
    location /openapi.json {
      proxy_pass http://backend:8000;
    }

    location / {
      proxy_pass http://frontend:3000;
      # Next.js dev 의 HMR 은 websocket 을 쓴다
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
