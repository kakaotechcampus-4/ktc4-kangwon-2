# 리버스 프록시. 서버의 유일한 입구다.
# 보안그룹에서 80 · 443 만 열고 8000 · 3000 은 닫는다 — 그래야 이 파일이 실제 방어선이 된다.
#
# **80 은 두 가지만 한다** — 인증서 갱신 확인(ACME)과 443 으로 보내기.
# 교사가 http 로 들어와도 아동 실명이 평문으로 나가지 않는다(ADR-004 · ADR-013).
#
# **예외는 localhost 하나다.** 내 컴퓨터에는 Let's Encrypt 인증서가 없어 자체 서명을
# 쓰는데, 거기로 보내면 매번 브라우저 경고를 지나야 한다. 밖에서 들어오는 요청은
# localhost 로 올 수 없으므로(그 이름은 그 컴퓨터 안에서만 자기를 가리킨다) 이 예외가
# 운영의 평문 경로를 열지 않는다.

events {}

http {
  # 업로드 크기 제한. 앱보다 앞에서 끊는다.
  # 실측: 충청북도 계획안 23개 중 최대 3.6MB(스캔 PDF) · 평균 0.3MB. 약 3배 여유.
  # 값을 바꾸면 backend 쪽 한도도 같이 맞춘다 — 다르면 안내 문구가 안 보인다.
  client_max_body_size 10m;

  # 파싱이 수 초 걸린다. 기본 60초로는 큰 양식에서 끊긴다.
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  # 프록시를 거치면 앱이 보는 IP 가 nginx 가 된다. 원래 값을 헤더로 넘긴다.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # 인증서가 아직 없으면 nginx 가 안 뜬다. scripts/https-setup.sh 가 임시 인증서를
  # 먼저 만들고 certbot 이 진짜 것으로 바꾼다.
  # 내 컴퓨터 전용. 평문 그대로 앱을 띄운다.
  #
  # **`server_name` 만으로는 못 막는다.** 그건 요청에 적힌 `Host` 글자를 보는데,
  # 그 글자는 보내는 쪽이 아무 값이나 적을 수 있다. 실제로 밖에서
  # `curl -H "Host: localhost" http://<서버IP>/api/observations` 가 평문 200 으로 열렸다
  # (멘토 리뷰 #119). 아동 실명이 평문으로 나가는 길이라 ADR-004 · ADR-013 위반이다.
  #
  # 그래서 **출발지 IP** 로 한 번 더 막는다. `Host` 와 달리 IP 는 위조할 수 없다 —
  # TCP 는 답장을 받아야 연결이 되는데, 남의 IP 를 적으면 답장이 그쪽으로 간다.
  #
  # **nginx 가 보는 출발지는 127.0.0.1 이 아니다.** nginx 가 컨테이너 안에 있어서,
  # 내 컴퓨터에서 localhost 를 쳐도 한 단계를 거친 주소로 보인다. 그게 운영체제마다 다르다.
  #
  #   리눅스(서버)            172.28.0.1       도커 브리지 게이트웨이
  #   Docker Desktop(맥·윈)   192.168.65.1     Desktop VM 의 게이트웨이. 실측값이다
  #
  # 172.28 대역은 docker-compose.yml 이 못 박는다 — 안 박으면 도커가 빈 곳을 골라 써서
  # 사람마다 172.18 · 172.19 … 로 달라지고, 여기 적을 주소를 하나로 정할 수 없다.
  #
  # **밖에서 온 요청은 이 주소로 안 보인다.** 리눅스에서 바깥 연결은 원래 IP 를 그대로
  # 달고 들어오므로 `deny all` 에 걸린다. 서버에 올린 뒤 nginx 로그로 한 번 확인한다.
  server {
    listen 80;
    server_name localhost 127.0.0.1;

    allow 127.0.0.1;
    allow 172.28.0.1;    # 리눅스 도커 게이트웨이
    allow 192.168.65.0/24; # Docker Desktop (맥 · 윈도)
    deny all;

    location /health {
      proxy_pass http://backend:8000;
    }
    include /etc/nginx/app-routes.conf;
  }

  server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt 가 "이 도메인이 네 것이 맞나" 를 확인하는 경로. 평문이어야 한다.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # 배포 판정은 평문으로도 받는다 — deploy.yml 이 EC2 안에서 부른다.
    location /health {
      proxy_pass http://backend:8000;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/ssample.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssample.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    # 브라우저가 다음부터 http 를 아예 안 쓰게 한다. 1년.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 배포 판정. deploy.yml 이 이 경로를 본다.
    location /health {
      proxy_pass http://backend:8000;
    }

    include /etc/nginx/app-routes.conf;
  }
}
