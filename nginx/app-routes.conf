# 앱으로 보내는 규칙. 443(운영)과 80(내 컴퓨터) 두 블록이 같이 쓴다.
# 두 벌로 두면 한쪽만 고쳐서 「배포에서만 404」가 난다.
#
# 이 폴더(nginx/)는 컨테이너의 /etc/nginx 에 통째로 연결된다(docker-compose.yml). 고치면 배포가
# nginx -t 로 검사한 뒤 reload 로 반영한다 — 컨테이너를 다시 만들지 않는다(scripts/deploy.sh).

# /api 아래 이 두 개만 Next Route Handler 다 (app/api/assistant,
# app/api/templates/extract). 아래 `location /api/` 가 전부 FastAPI 로 보내면
# 배포에서만 404 가 난다 — 로컬 next dev 는 nginx 를 거치지 않아 드러나지 않는다.
# `=` 는 정확히 그 경로일 때만 잡는다. 접두사로 잡으면 나중에 FastAPI 가 쓸 수도 있는
# /api/templates/... 를 조용히 가로챈다. **Next 에 API route 를 추가하면 한 줄 늘린다.**
location = /api/assistant {
  proxy_pass http://frontend:3000;
}
location = /api/templates/extract {
  proxy_pass http://frontend:3000;
}

# ADR-043 §5: 연간 4구간(각 120초) + 30초 여유. 같은 URI의 목록 GET도 적용된다.
location = /api/plans/annual {
  proxy_pass http://backend:8000;
  proxy_read_timeout 510s;
}

# ADR-046 §5: 놀이 중심 월간 생성은 첫 요청 + 수리 최대 1회(각 120초) + 30초 여유.
# 응답을 다 받기 전에 끊으면 화면은 실패인데 서버는 저장한다. 같은 URI의 목록 GET도 적용된다.
location = /api/plans/monthly/play {
  proxy_pass http://backend:8000;
  proxy_read_timeout 270s;
}
# v1 월간 생성도 같다(첫 요청 + 수리 최대 1회, 각 120초). 칸 수정은 /api/ 기본값이다.
location = /api/plans/monthly {
  proxy_pass http://backend:8000;
  proxy_read_timeout 270s;
}

# 주간 활동 후보도 첫 생성·수리 각 120초와 30초 여유를 둔다.
location = /api/plans/weekly {
  proxy_pass http://backend:8000;
  proxy_read_timeout 270s;
}

# 월간 · 주간 칸 재생성도 LLM 첫 요청 + 수리 최대 1회다. 120초 기본값에 끊기면 서버는 저장했는데
# 화면은 「서버에 연결하지 못했어요」였다(멘토 리뷰 #380). 생성과 같은 270초다.
location ~ ^/api/plans/(monthly|weekly)/[0-9]+/cells/[^/]+/regenerate$ {
  proxy_pass http://backend:8000;
  proxy_read_timeout 270s;
}

# 연간 가져오기 파일 추출 — 파일 변환(hwp5html) 뒤 LLM 한 번이다. 120초 기본값이었다(멘토 리뷰 #380).
# 같은 270초를 두고 운영 호출 기록을 본 뒤 조정한다.
location = /api/plans/annual/import/extract {
  proxy_pass http://backend:8000;
  proxy_read_timeout 270s;
}

# 나머지 /api 는 전부 FastAPI 다 (main.py).
location /api/ {
  proxy_pass http://backend:8000;
}

location /docs {
  proxy_pass http://backend:8000;
}
location /openapi.json {
  proxy_pass http://backend:8000;
}

location / {
  proxy_pass http://frontend:3000;
  # Next.js dev 의 HMR 은 websocket 을 쓴다
  proxy_http_version 1.1;
  proxy_set_header Upgrade    $http_upgrade;
  proxy_set_header Connection "upgrade";
}
