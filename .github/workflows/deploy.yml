name: Deploy

# ⚠️ 자동 실행이 꺼져 있다. 지금은 손으로 배포한다 — docs/deploy.md 「손으로 배포」.
#
# 2026-09-22 카테캠 안내: 22 포트 외부 개방을 지양할 것. 다른 팀이 공격을 받았다.
# 우리는 키 인증만 쓰고 비밀번호 로그인이 꺼져 있어(passwordauthentication no)
# 뚫릴 가능성은 낮았지만, 팀 전체 기준이라 22 를 닫았다.
#
# 22 를 닫으면 GitHub Actions 가 서버에 들어갈 길이 없어진다.
# 카테캠이 OIDC 가이드를 준비 중이다 — IAM 역할은 관리자만 만들 수 있고(ADR-006)
# 그게 오면 SSM 으로 명령을 보내는 방식으로 바꾼다. 인바운드 포트가 0개가 된다.
#
# 그때까지 push 트리거를 끈다. 켜두면 main 머지마다 SSH 실패로 빨간불이 뜨고
# Discord 알림이 울려서 진짜 실패와 구분이 안 된다.
#
# 아래 job 은 OIDC 로 옮길 때 재사용할 뼈대다. 지우지 않는다.

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: /home/ubuntu/ktc4-kangwon-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # OIDC 로 옮기기 전까지는 수동 실행해도 SSH 가 막혀 실패한다.
    if: false
    steps:
      # OIDC 전환 시 이 자리에 aws-actions/configure-aws-credentials 와
      # SSM send-command 가 들어간다. 아래 script 의 내용은 그대로 옮겨 쓴다.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            # 저장소가 공개라 HTTPS 는 인증이 필요 없다. SSH 원격이면 서버에 GitHub 키를
            # 따로 관리해야 하고, 없으면 fetch 가 Permission denied 로 죽는다.
            # 그 상태에서 reset --hard 를 하면 13일 전 origin/main 으로 되감긴다(실제로 당했다).
            git remote set-url origin https://github.com/${{ github.repository }}.git

            git fetch --prune origin
            git checkout main

            # fetch 가 실패하면 origin/main 이 옛 커밋을 가리킨 채 남는다.
            # 그대로 reset 하면 조용히 과거로 되돌아간다. 파일이 있는지 본다.
            git reset --hard origin/main
            test -f docker-compose.yml || { echo "docker-compose.yml 이 없다. fetch 가 안 됐다"; exit 1; }
            echo "배포 커밋 $(git rev-parse --short HEAD) — $(git log -1 --format=%s)"

            # .env 는 커밋하지 않으므로 서버에만 있다.
            test -f .env || { echo ".env 가 없다. 서버에서 한 번 만들어야 한다"; exit 1; }

            docker compose build backend frontend

            # 마이그레이션을 앱보다 먼저 돌린다. 반대로 하면 새 코드가 없는 컬럼을 읽는다.
            docker compose run --rm backend alembic upgrade head

            docker compose up -d
            docker image prune -f

      # /health 가 아니라 /health/ready 다 — /health 는 DB 를 안 보고 200 을 준다(ADR-011).
      - name: Health check
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "${HEALTHCHECK_URL}/health/ready" || echo 000)
            if [ "$code" = "200" ]; then
              echo "health/ready 200 (${attempt}회째)"
              exit 0
            fi
            echo "대기 ${attempt}/30 — 마지막 응답 ${code}"
            sleep 5
          done
          echo "150초 안에 200 이 오지 않았다"
          exit 1

      - name: 실패 알림
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$WEBHOOK" || exit 0
          curl -fsS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$(printf '{"content":"🔴 배포 실패 — %s\\n%s"}' "${GITHUB_SHA:0:7}" "$RUN_URL")" \
            || echo "알림 전송 실패. 배포 결과는 위 스텝들을 본다"
