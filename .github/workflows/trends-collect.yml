# 트렌드 주간 수집 (ADR-016). 월요일 새벽에 돌고, 결과를 PR 로 올린다.
#
# **PR 이 승인 절차다.** 사람이 diff 를 읽고 이상한 줄을 지운다 — 관리자 화면을
# 만들지 않기로 했다(ADR-016 결정 5). 그래서 바로 develop 에 넣지 않는다.
#
# 키가 없으면 그 소스만 건너뛴다. 둘 다 없으면 0건짜리 PR 이 올라오는데,
# 그게 "이번 주는 유행이 없나 보다" 로 읽히면 안 되므로 0건이면 멈춘다.
name: trends

on:
  schedule:
    # UTC 일요일 19:00 = 한국 월요일 새벽 4시
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    name: trends (weekly collect)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # **러너는 UTC 다.** 일요일 19:00 UTC 에 깨어나므로 date.today() 가 일요일이 되고,
      # 주 라벨이 한 주 밀려 지난주 파일을 덮어쓴다. job 전체를 한국 시간으로 돌린다.
      TZ: Asia/Seoul
      # 수집은 DB 를 쓰지 않는다. app.config 가 읽을 수 있게 모양만 채운다.
      DATABASE_URL: postgresql+psycopg://x:x@127.0.0.1:1/x
      SECRET_KEY: ci-only-not-a-secret
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pytest job 과 같은 이유로 -e 로 깐다 (resources 를 저장소 경로에서 찾는다).
      - name: Install planning core
        working-directory: p0-planning
        run: pip install -e .
      - name: Install backend
        working-directory: backend
        run: pip install -e .

      - name: collect
        # 기본 셸은 pipefail 이 없다. tee 로 넘기면 python 이 죽어도 성공으로 읽혀
        # 지난주 파일이 남아 있는 채로 다음 단계가 통과한다.
        shell: bash
        id: collect
        working-directory: backend
        run: |
          python -m app.features.trends.collect | tee /tmp/collect.log
          # 실패가 있어도 멈추지 않는다 — 유튜브가 죽어도 뉴스는 모은다.
          # 대신 PR 본문에 그대로 적어 사람이 본다.
          {
            echo 'log<<EOF'
            cat /tmp/collect.log
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # **이 PR 에는 CI 가 안 붙는다.** GITHUB_TOKEN 으로 만든 PR 은 pull_request 를
      # 깨우지 않는다(GitHub 규칙 — 작업이 작업을 무한히 부르는 것을 막는다).
      # 그래서 파일이 제대로 됐는지를 여기서 본다. 머지된 뒤 develop push 에서
      # 평소 CI 가 다시 돈다.
      - name: 받은 파일이 읽히나
        working-directory: backend
        run: |
          week=$(python -c "from app.features.trends.item import week_label; from datetime import date; print(week_label(date.today()))")
          file="resources/trends/collected/${week}.json"
          # item.load 는 RawItem(**item) 으로 되살린다 — 열이 바뀌면 여기서 터진다.
          count=$(python -c "from pathlib import Path; from app.features.trends.item import load; print(len(load(Path('${file}'))))")
          echo "${week} ${count}건"
          test "$count" -gt 0 || { echo "0건이다. 키가 빠졌거나 소스가 전부 죽었다."; exit 1; }

      # 2단. **거르지 않고 표시만 한다** — 위험한 콘텐츠와 안전교육 콘텐츠는 같은 낱말을
      # 쓴다(ADR-016). 어느 줄을 먼저 볼지 사람에게 알려주는 것이 전부다.
      - name: 위험 표시
        id: risk
        working-directory: backend
        shell: bash
        run: |
          {
            echo 'marked<<EOF'
            python - <<'PY'
          from datetime import date
          from pathlib import Path

          from app.features.trends.flags import flags
          from app.features.trends.item import load, week_label

          items = load(Path(f"resources/trends/collected/{week_label(date.today())}.json"))
          marked = [(item, flags(item)) for item in items]
          marked = [(item, found) for item, found in marked if found]
          if not marked:
              print("표시된 줄 없음")
          for item, found in marked:
              print(f'- ⚠️ {"·".join(found)} — {item.title}')
              print(f"  {item.url}")
          PY
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: PR 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          week=$(cd backend && python -c "from app.features.trends.item import week_label; from datetime import date; print(week_label(date.today()))")
          branch="trends/collect-${week}"
          # **이미 그 주 브랜치가 있으면 내용은 손대지 않는다.** 리뷰어가 이상한 줄을
          # 지워 둔 상태일 수 있다. 덮어쓰면 그 지운 것이 되살아나 승인 절차가
          # 무의미해진다. 대신 PR 이 없으면 만든다 — 지난번에 push 는 됐는데
          # PR 만들기가 실패했으면, 그 주 자료가 승인 절차 밖에 남아 있다.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "$branch 가 이미 있다. 내용은 그대로 두고 PR 만 확인한다."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$branch"
            git add backend/resources/trends/collected
            git diff --cached --quiet && { echo "바뀐 것이 없다"; exit 0; }
            git commit -m "chore: 트렌드 원자료 ${week}"
            git push -u origin "$branch"
          fi
          # **열려 있는** PR 만 센다. 지난주 것이 머지돼 있어도 gh pr view 는 찾아내서,
          # 새 자료가 승인 절차 없이 브랜치에만 남는다.
          test -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" \
            || gh pr create \
            --base develop --head "$branch" \
            --title "chore: 트렌드 원자료 ${week} — 읽고 이상한 줄을 지워주세요" \
            --body "$(cat <<'BODY'
          주 1회 자동 수집 결과다 (ADR-016). **이 PR 이 승인 절차다.**

          ### 보는 법
          - 만 3~5세에 안 맞는 줄을 지운다
          - 장난감 개봉·상품 소개처럼 교사가 옮겨 적을 게 없는 줄을 지운다
          - 위험한 놀이(밀기·목·숨 참기·높은 곳)는 지우고, 2단 금칙 목록에 낱말을 더한다

          ### 위험 표시 (2단)
          **버린 것이 아니다.** 낱말이 걸린 줄이다 — 먼저 보라는 뜻이고, 안전교육
          영상도 같은 낱말에 걸린다(ADR-016).

          ${{ steps.risk.outputs.marked }}

          ### 수집 기록
          ```
          ${{ steps.collect.outputs.log }}
          ```
          BODY
          )"
