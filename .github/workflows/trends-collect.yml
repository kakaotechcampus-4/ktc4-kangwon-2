# 트렌드 주간 수집 (ADR-016). 월요일 새벽에 돌고, 결과를 PR 로 올린다.
#
# **PR 이 승인 절차다.** 사람이 diff 를 읽고 이상한 줄을 지운다 — 관리자 화면을
# 만들지 않기로 했다(ADR-016 결정 5). 그래서 바로 develop 에 넣지 않는다.
#
# 키가 없으면 그 소스만 건너뛴다. 둘 다 없으면 0건짜리 PR 이 올라오는데,
# 그게 "이번 주는 유행이 없나 보다" 로 읽히면 안 되므로 0건이면 멈춘다.
name: trends

on:
  schedule:
    # UTC 일요일 19:00 = 한국 월요일 새벽 4시
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    name: trends (weekly collect)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # **러너는 UTC 다.** 일요일 19:00 UTC 에 깨어나므로 date.today() 가 일요일이 되고,
      # 주 라벨이 한 주 밀려 지난주 파일을 덮어쓴다. job 전체를 한국 시간으로 돌린다.
      TZ: Asia/Seoul
      # 수집은 DB 를 쓰지 않는다. app.config 가 읽을 수 있게 모양만 채운다.
      DATABASE_URL: postgresql+psycopg://x:x@127.0.0.1:1/x
      SECRET_KEY: ci-only-not-a-secret
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pytest job 과 같은 이유로 -e 로 깐다 (resources 를 저장소 경로에서 찾는다).
      - name: Install planning core
        working-directory: p0-planning
        run: pip install -e .
      - name: Install backend
        working-directory: backend
        run: pip install -e .

      - name: collect
        # 기본 셸은 pipefail 이 없다. tee 로 넘기면 python 이 죽어도 성공으로 읽혀
        # 지난주 파일이 남아 있는 채로 다음 단계가 통과한다.
        shell: bash
        id: collect
        working-directory: backend
        run: |
          python -m app.features.trends.collect | tee /tmp/collect.log
          # 주 라벨은 여기서 한 번만 구해 뒤 단계가 같이 쓴다. 단계마다 date.today() 를
          # 부르면 자정을 넘기는 순간 파일과 브랜치가 다른 주를 가리킨다.
          week=$(python -c "from datetime import date; from app.features.trends.item import week_label; print(week_label(date.today()))")
          echo "week=$week" >> "$GITHUB_OUTPUT"

      # **이 PR 에는 CI 가 안 붙는다.** GITHUB_TOKEN 으로 만든 PR 은 pull_request 를
      # 깨우지 않는다(GitHub 규칙 — 작업이 작업을 무한히 부르는 것을 막는다).
      # 그래서 파일이 제대로 됐는지를 여기서 본다. 머지된 뒤 develop push 에서
      # 평소 CI 가 다시 돈다.
      - name: 받은 파일이 읽히나
        working-directory: backend
        env:
          WEEK: ${{ steps.collect.outputs.week }}
        run: |
          week="$WEEK"
          file="resources/trends/collected/${week}.json"
          # item.load 는 RawItem(**item) 으로 되살린다 — 열이 바뀌면 여기서 터진다.
          count=$(python -c "from pathlib import Path; from app.features.trends.item import load; print(len(load(Path('${file}'))))")
          echo "${week} ${count}건"
          test "$count" -gt 0 || { echo "0건이다. 키가 빠졌거나 소스가 전부 죽었다."; exit 1; }

      # 브랜치를 먼저 정한다. **이미 그 주 브랜치가 있으면 그 내용을 쓴다** —
      # 리뷰어가 이상한 줄을 지워 둔 상태일 수 있다. 덮어쓰면 그 지운 것이 되살아나
      # 승인 절차가 무의미해진다. 위험 표시도 **그 파일**로 센다 — 새로 모은 것으로
      # 세면 PR 에 든 줄과 경고가 어긋난다.
      - name: 브랜치 준비
        id: branch
        shell: bash
        env:
          WEEK: ${{ steps.collect.outputs.week }}
        run: |
          branch="trends/collect-${WEEK}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "$branch 가 이미 있다. 그 내용을 그대로 쓴다."
            # 방금 모은 파일은 버린다. 그 경로를 브랜치가 이미 들고 있어서,
            # 추적 안 되는 파일이 남아 있으면 checkout 이 덮어쓰기를 거부하고 멈춘다.
            rm -f "backend/resources/trends/collected/${WEEK}.json"
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            exit 0
          fi
          git checkout -b "$branch"
          git add backend/resources/trends/collected
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: 트렌드 원자료 ${WEEK}"
          git push -u origin "$branch"

      # 2단. **거르지 않고 표시만 한다** — 위험한 콘텐츠와 안전교육 콘텐츠는 같은 낱말을
      # 쓴다(ADR-016). 어느 줄을 먼저 볼지 사람에게 알려주는 것이 전부다.
      - name: 위험 표시
        id: risk
        if: steps.branch.outputs.skip != '1'
        working-directory: backend
        shell: bash
        env:
          WEEK: ${{ steps.collect.outputs.week }}
        run: |
          python - <<'PY' > /tmp/risk.md
          import os
          from pathlib import Path

          from app.features.trends.flags import flags
          from app.features.trends.item import load

          items = load(Path(f"resources/trends/collected/{os.environ['WEEK']}.json"))
          marked = [(item, found) for item in items if (found := flags(item))]
          if not marked:
              print("표시된 줄 없음")
          for item, found in marked:
              # 제목은 그대로 적지 않는다 — 줄바꿈이 섞여 들어오면 글이 깨진다.
              title = " ".join(item.title.split())
              print(f'- ⚠️ {"·".join(found)} — {title}')
              print(f"  {item.url}")
          PY
          cat /tmp/risk.md

      # **제목을 셸 소스에 끼워 넣지 않는다.** `${{ }}` 는 스크립트 글자에 그대로 박히므로,
      # 제목에 줄바꿈과 heredoc 끝말이 섞여 오면 그 뒤가 명령으로 돈다. 이 단계는
      # GH_TOKEN 과 API 키를 들고 있어서 남의 영상 제목에 저장소를 내주게 된다(Codex P1).
      # 파일로 넘긴다.
      - name: PR 올리기
        if: steps.branch.outputs.skip != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          WEEK: ${{ steps.collect.outputs.week }}
        run: |
          # **열려 있는** PR 만 센다. 지난주 것이 머지돼 있어도 gh pr view 는 찾아내서,
          # 새 자료가 승인 절차 없이 브랜치에만 남는다.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "열려 있는 PR 이 이미 있다."
            exit 0
          fi
          {
            cat <<'HEAD'
          주 1회 자동 수집 결과다 (ADR-016). **이 PR 이 승인 절차다.**

          ### 보는 법
          - 만 3~5세에 안 맞는 줄을 지운다
          - 장난감 개봉·상품 소개처럼 교사가 옮겨 적을 게 없는 줄을 지운다
          - 위험한 놀이(밀기·목·숨 참기·높은 곳)는 지우고, risk-words.yaml 에 낱말을 더한다

          ### 위험 표시 (2단)
          **버린 것이 아니다.** 낱말이 걸린 줄이다 — 먼저 보라는 뜻이고, 안전교육
          영상도 같은 낱말에 걸린다(ADR-016).

          HEAD
            cat /tmp/risk.md
            printf '\n### 수집 기록\n```\n'
            cat /tmp/collect.log
            printf '```\n'
          } > /tmp/body.md
          gh pr create --base develop --head "$BRANCH" \
            --title "chore: 트렌드 원자료 ${WEEK} — 읽고 이상한 줄을 지워주세요" \
            --body-file /tmp/body.md
