# 임시 — 진짜 배포(deploy.yml)를 main 머지 전에 한 번 돌려본다.
#
# 한 번도 안 돌려본 워크플로가 곧바로 실서버에 도는 것을 피하려는 것이다.
# 내용은 deploy.yml 과 같고 트리거만 이 브랜치 push 다.
# 서버는 어차피 origin/main 으로 reset 하므로 결과가 같다.
#
# 첫 자동 배포가 성공하면 이 파일과 브랜치를 지운다.

name: Deploy

# main 에 머지되면 서버에 올린다.
#
# 서버에 들어가는 방법은 SSH 가 아니라 SSM 이다 — 카테캠 OIDC 가이드 §7.
# 인바운드 포트가 0개고, GitHub 에 저장하는 비밀키도 0개다.
# 22 는 2026-09-22 에 닫았다(다른 팀이 공격을 받았다).
#
# 서버에서 실제로 도는 명령은 scripts/deploy.sh 다. 이 워크플로는 그 파일을
# 통째로 보내고 결과를 기다릴 뿐이다. 손으로 배포할 때도 같은 파일을 쓴다.

on:
  push:
    branches: [ci/oidc-auth]

# 같은 서버에 두 배포가 겹치면 컨테이너가 반쯤 바뀐 상태가 된다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# 이 블록을 쓰는 순간 명시하지 않은 권한은 전부 none 이 된다.
permissions:
  id-token: write # 빠지면 OIDC 인증이 실패한다
  contents: read # checkout 용

env:
  INSTANCE_ID: i-041ebb00937bd371f # ktc4-team-server
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ap-northeast-2

      # 스크립트 파일을 서버에 미리 둘 필요가 없다. 이 커밋의 내용을 그대로 보낸다.
      # executionTimeout 은 서버에서 도는 시간이다. docker build 가 오래 걸린다.
      - name: 배포 명령 보내기
        id: send
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA:0:7}" \
            --parameters "$(jq -n --rawfile script scripts/deploy.sh \
              '{commands: [$script], executionTimeout: ["1800"]}')" \
            --query Command.CommandId --output text)
          echo "배포 명령 $command_id"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      # send-command 는 보내고 바로 끝난다. 끝날 때까지 안 기다리면 실패해도 초록불이 뜬다.
      # aws ssm wait 는 100초에서 포기해서 docker build 를 못 기다린다. 직접 돈다.
      - name: 끝날 때까지 기다린다
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          status=Pending
          for attempt in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending | InProgress | Delayed) ;;
              *) break ;;
            esac
            sleep 10
          done

          echo "--- 서버 출력 ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "--- 서버 오류 ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text

          # 출력은 24000자에서 잘린다. 전문이 필요해지면 S3 로 내보내는 설정을 붙인다.
          echo "상태 $status"
          test "$status" = Success

      # /health 가 아니라 /health/ready 다 — /health 는 DB 를 안 보고 200 을 준다(ADR-011).
      - name: Health check
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "${HEALTHCHECK_URL}/health/ready" || echo 000)
            if [ "$code" = "200" ]; then
              echo "health/ready 200 (${attempt}회째)"
              exit 0
            fi
            echo "대기 ${attempt}/30 — 마지막 응답 ${code}"
            sleep 5
          done
          echo "150초 안에 200 이 오지 않았다"
          exit 1

      - name: 실패 알림
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$WEBHOOK" || exit 0
          curl -fsS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$(printf '{"content":"🔴 배포 실패 — %s\\n%s"}' "${GITHUB_SHA:0:7}" "$RUN_URL")" \
            || echo "알림 전송 실패. 배포 결과는 위 스텝들을 본다"
