name: CI

on:
  pull_request:
  # 머지 커밋 자체는 아무도 검사하지 않았다. PR 두 개가 각자 통과해도
  # 합친 결과가 깨질 수 있다 — import 두 개가 각자 옳은 위치에 있다가
  # 머지 후 그룹 사이에 빈 줄이 남은 것이 실제 사례다.
  push:
    branches: [develop, main]

# 같은 PR 에 연달아 push 하면 이전 실행을 취소한다.
# 최신 커밋 결과만 보는데 러너는 계속 점유된다.
#
# push 를 넣으면서 develop·main 도 같은 그룹이 됐다. 연속 머지 때 앞 머지의
# run 이 취소되지만, 뒤 머지의 run 이 두 변경을 합친 상태를 검사하므로 깨짐
# 자체는 잡힌다. 어느 머지가 깼는지 안 보일 뿐이다.
# PR 과 push 는 ref 가 달라(refs/pull/N/merge vs refs/heads/develop) 안 겹친다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 바뀐 파일을 보고 무거운 검사를 건너뛸지 정한다. **PR 에서만 고른다** —
  # develop · main push 는 머지 결과라 늘 전부 돈다(마지막 안전망).
  #   문서만 바뀐 PR            → 아래 잡 전부 건너뜀
  #   frontend/ 만 바뀐 PR      → backend 잡 4개(ruff · alembic · pytest · docker) 건너뜀
  #   backend/alembic/versions 가 안 바뀐 PR → rollback compat 건너뜀(migrations)
  #   그 밖 · 판단할 수 없을 때  → 전부 돈다
  # 이 잡이 실패해도 아래 잡은 전부 돈다(needs.changes.result). 건너뛴 잡은 GitHub 이 통과로 쳐서
  # main 필수 검사(ruff · alembic · frontend)를 판정 실패 하나로 비켜 갈 수 있기 때문이다.
  # --no-renames: 이름 바꾸기는 새 경로만 나와 backend/ 에서 docs/ 로 옮긴 PR 을 문서만으로 본다.
  # frontend/ 안의 .md 는 문서로 치지 않는다 — prettier 가 .md 도 검사한다.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.pick.outputs.docs_only }}
      frontend_only: ${{ steps.pick.outputs.frontend_only }}
      migrations: ${{ steps.pick.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          # PR 머지 커밋과 그 첫 부모(base)만 있으면 PR 이 바꾼 파일이 나온다.
          fetch-depth: 2
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
        run: |
          docs=false
          front=false
          # 판단할 수 없으면 true(= rollback compat 이 돈다). 경로 이름을 글자로 맞추지 않는다 — 탭 같은 글자가 든
          # 파일 이름은 git 이 따옴표로 감싸 찍어서 맞추기를 빠져나간다. git 이 「안 바뀌었다」(종료 0)고 할 때만 false 다.
          # 바뀜(1)도 오류(128, base 를 못 읽음 등)도 true 로 남는다.
          migr=true
          if [ "$EVENT" = pull_request ] &&
            git diff --quiet --no-renames HEAD^1 HEAD -- backend/alembic/versions/; then
            migr=false
          fi
          if [ "$EVENT" = pull_request ] &&
            files=$(git -c core.quotepath=off diff --no-renames --name-only HEAD^1 HEAD) &&
            [ -n "$files" ]; then
            docs=true
            front=true
            while IFS= read -r f; do
              case "$f" in
                frontend/*) docs=false ;;
                docs/* | graphify-out/* | *.md) ;;
                *) docs=false ;;
              esac
              case "$f" in
                frontend/*) ;;
                *) front=false ;;
              esac
            done <<< "$files"
            printf '%s\n' "$files"
          fi
          echo "docs_only=$docs frontend_only=$front migrations=$migr"
          echo "docs_only=$docs" >> "$GITHUB_OUTPUT"
          echo "frontend_only=$front" >> "$GITHUB_OUTPUT"
          echo "migrations=$migr" >> "$GITHUB_OUTPUT"

  # 이름은 develop 필수 검사라 바꾸지 않는다 — ruff 와 mypy 를 같이 돈다(ADR-095).
  backend:
    name: backend (ruff)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.frontend_only != 'true')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.6
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      # 타입 검사(ADR-095). 타입을 읽으려면 앱 의존이 깔려 있어야 한다. p0-planning 을 먼저 깐다 —
      # backend 가 ssuksak-planning 을 의존하는데 그 이름은 PyPI 에 없다.
      # ruff 가 실패해도 타입 결과가 보이게 !cancelled() 로 돈다 — 앞 단계 실패가 뒤를 가리지 않게(ADR-011).
      - name: Install planning core
        if: ${{ !cancelled() }}
        working-directory: p0-planning
        run: pip install -e .
      - name: Install
        id: install
        if: ${{ !cancelled() }}
        run: pip install -e ".[dev]"
      - name: mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy

  migration:
    name: backend (alembic check)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.frontend_only != 'true')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: ssuksak
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: ssuksak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ssuksak -d ssuksak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ssuksak:ci-only-not-a-secret@localhost:5432/ssuksak
      # alembic env.py 가 app.db 를 import 하고, 그때 Settings 가 평가된다.
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # p0-planning 을 먼저 깐다. backend 가 ssuksak-planning 을 의존하는데
      # 그 이름은 PyPI 에 없다 — 같은 저장소의 옆 패키지다.
      - name: Install planning core
        working-directory: p0-planning
        run: pip install .
      - name: Install
        run: pip install .
      # models.py 를 고치고 마이그레이션을 안 만들면 로컬은 되는데
      # 배포 후 컬럼이 없어서 터진다. 그 어긋남을 여기서 잡는다.
      - name: alembic upgrade head
        run: alembic upgrade head
      - name: alembic check
        run: alembic check

  frontend:
    name: frontend (eslint · prettier · build)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: prettier (format:check)
        run: npm run format:check
      - name: next build
        run: npm run build
      # 통합 테스트는 실제 서버가 필요하다(SAESSAK_TEST_URL이 없으면 node:test가 skip한다).
      # build 결과를 그대로 띄우고, 준비된 것을 확인한 뒤에만 테스트를 시작한다.
      - name: frontend tests
        env:
          SAESSAK_TEST_URL: http://127.0.0.1:3000
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/saessak-next.log 2>&1 &
          NEXT_PID=$!
          trap 'kill $NEXT_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS "$SAESSAK_TEST_URL/login" > /dev/null; then break; fi
            if ! kill -0 "$NEXT_PID" 2>/dev/null; then
              echo "Next.js server exited before becoming ready."
              cat /tmp/saessak-next.log
              exit 1
            fi
            sleep 1
          done
          if ! curl -fsS "$SAESSAK_TEST_URL/login" > /dev/null; then
            echo "Next.js server did not become ready."
            cat /tmp/saessak-next.log
            exit 1
          fi
          npm test

  test:
    name: backend (pytest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.frontend_only != 'true')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: ssuksak
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: ssuksak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ssuksak -d ssuksak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ssuksak:ci-only-not-a-secret@localhost:5432/ssuksak
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # -e 로 깐다. 비편집 설치면 app 이 site-packages 에서 import 되고
      # mapping.py 의 parents[3] 가 site-packages 를 가리켜
      # resources/forms/label_mapping.json 을 못 찾는다.
      # p0-planning 을 먼저 깐다. backend 가 ssuksak-planning 을 의존하는데
      # 그 이름은 PyPI 에 없다 — 같은 저장소의 옆 패키지다.
      - name: Install planning core
        working-directory: p0-planning
        run: pip install -e .
      - name: Install
        run: pip install -e ".[dev]"
      # PDF 내보내기 테스트가 한글 글꼴을 쓴다 (ADR-061, hwpx_pdf.FONT_CANDIDATES).
      - name: Install Korean font
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      # postgres 를 띄운다. /health/ready 200 이 배포 성공 판정이 보는 응답이라
      # 실제 DB 로 확인한다. 503 은 SessionLocal 을 모의해서 본다. ADR-011.
      - name: pytest — 실 Postgres 통합 (real_db)
        id: real_db
        run: pytest -m real_db
      # 위 단계가 실패해도 돌아 백엔드 실패가 한 번에 다 보이게 한다 (전에는 한 단계라 그랬다).
      # 닿지 않는 주소로 돈다. 연결 거부로 죽으면 real_db 표시 누락 — `_schema` 를 받게 한다.
      - name: pytest — DB 없는 테스트
        if: ${{ success() || steps.real_db.outcome == 'failure' }}
        env:
          DATABASE_URL: postgresql+psycopg://x:x@127.0.0.1:1/x
        run: pytest -m "not real_db"
      # p0-planning 은 backend 와 별도 패키지라 위 pytest 가 보지 않는다.
      # job 을 새로 만들지 않고 스텝으로 붙인다 — job 개수는 멘토 리뷰 후 정한다.
      - name: planning core pytest
        working-directory: p0-planning
        run: pytest

  # **운영 코드가 이 PR 의 새 DB 에서 도는가**를 본다(ADR-073). 롤백이 마이그레이션을 건너뛰어도 되는
  # 근거가 이 job 이다 — scripts/deploy.sh 는 「이 job 이 시험한 코드」로 되감을 때만 `alembic upgrade`
  # 를 건너뛴다.
  #
  #   코드      = base(HEAD^1). main 으로 가는 PR 이면 운영에서 돌고 있는 main 끝, develop 으로 가는 PR 이면 develop 끝이다.
  #   DB 스키마 = 이 PR 의 마이그레이션까지 올린 것(머지 뒤 운영 DB 와 같다).
  #   통과      = backend pytest 전부. 대조군과 비교하지 않는다.
  #
  # base 를 HEAD^1 로 잡아도 되는 이유: develop 규칙이 「브랜치를 최신으로」(strict)를 요구해서 PR 머지 커밋의
  # 첫 부모가 develop 끝이다. 머지하면 그 커밋이 머지 커밋 M 의 앞 커밋 B 가 되고, deploy.sh 가 같은 B 를
  # 찾아 판정한다. 그래서 둘이 같은 가정 위에 있다.
  # 필수 검사로 켜기 전에는 경고등일 뿐이다 — develop 규칙의 required 에 `backend (rollback compat)` 를 더한다.
  #
  # **main · develop 으로 가는 PR 에서** 돈다(ADR-094). push 에는 base 가 없다. main 으로 가는 PR 은 develop 이 쌓은
  # 마이그레이션을 한꺼번에 얹는다 — 배포는 main 머지로 나가서 직전 main 이 되감을 곳이고, deploy.sh 가 main 의
  # first-parent 에서 같은 B 를 찾는다. main 규칙에는 필수 검사가 없어서 main 쪽은 경고등이다.
  # 마이그레이션이 안 바뀐 PR 은 건너뛰고, 판단할 수 없으면 돈다.
  rollback-compat:
    name: backend (rollback compat)
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main') && (needs.changes.result != 'success' || needs.changes.outputs.migrations != 'false') }}
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: ssuksak
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: ssuksak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ssuksak -d ssuksak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ssuksak:ci-only-not-a-secret@localhost:5432/ssuksak
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD = PR 머지 커밋(M), HEAD^1 = base(B).
          fetch-depth: 2
      # 이미 있는 마이그레이션을 고치거나 지우면 운영 DB 에 올라간 리비전이 바뀐다 — 롤백이 어느 쪽으로도 안 맞는다.
      # 그래서 M·D·R 이 있으면 여기서 멈추고, 새 파일(A)만 base 위에 얹는다.
      # `git restore` 는 overlay 가 아니다 — M 에 없는 파일은 작업 폴더에서도 사라진다
      # (`git checkout M -- 경로` 는 B 에만 있는 파일을 남긴다).
      - name: base 코드에 이 PR 의 마이그레이션만 얹는다
        run: |
          M=$(git rev-parse HEAD)
          B=$(git rev-parse HEAD^1)
          changed=$(git diff --name-only --diff-filter=MDR "$B" "$M" -- backend/alembic/versions)
          if [ -n "$changed" ]; then
            echo "이미 있는 마이그레이션을 고치거나 지웠다. 운영 DB 에 올라간 리비전이라 되감기가 깨진다:"
            echo "$changed"
            exit 1
          fi
          git checkout --detach "$B"
          git restore --source="$M" --worktree -- backend/alembic/versions
          echo "코드 $B (base) · 마이그레이션 $M (PR 머지 커밋)"
          git status --short
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 아래는 test job 과 같다. 다만 이 작업 폴더는 base 코드다.
      # pytest 는 test job 처럼 나누지 않는다 — base 코드엔 real_db 마커 훅이 없어 -m real_db 가 0건(종료 코드 5)이다.
      - name: Install planning core
        working-directory: p0-planning
        run: pip install -e .
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      # PDF 내보내기 테스트가 한글 글꼴을 쓴다 (ADR-061, hwpx_pdf.FONT_CANDIDATES).
      - name: Install Korean font
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      - name: pytest
        working-directory: backend
        run: pytest

  docker:
    name: backend (docker build)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.frontend_only != 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docker compose 를 쓰지 않는다 — POSTGRES_PASSWORD·DATABASE_URL 이
      # ${VAR:?} 라 .env 없이는 보간 단계에서 죽는다.
      # frontend 이미지도 빌드하지 않는다 — npm ci + next build 재실행이라
      # frontend job 과 신호가 같다. ADR-011.
      # 맥락이 뿌리다 — 이미지가 p0-planning 도 담는다.
      - name: docker build
        run: docker build -t ssuksak-backend:ci -f backend/Dockerfile .
      # 빌드만으로는 COPY 한 줄이 빠진 걸 모른다. import 까지 해본다.
      # Settings 가 기동 시점에 평가되므로 필수 환경변수를 다 줘야 한다 — 하나라도
      # 빠지면 "COPY 가 빠졌다" 가 아니라 "환경변수가 없다" 로 죽어 신호가 흐려진다.
      - name: 이미지가 앱을 import 하나
        run: >-
          docker run --rm
          -e DATABASE_URL=postgresql+psycopg://x:x@127.0.0.1:1/x
          -e SECRET_KEY=ci-only-not-a-secret
          ssuksak-backend:ci python -c "import app.main"
      # **import 만으로는 모자란다.** 참조자료가 p0-planning/data/ 에 있는데 그 폴더는
      # 패키지 밖이라, 설치 방식에 따라 이미지 안에서 사라진다. import 는 멀쩡히 되고
      # 계획안을 만들 때 FileNotFoundError 로 죽는다 — 실제로 한 번 냈다.
      # 파일이 있는지가 아니라 **읽어지는지**를 본다.
      # **import 만으로는 모자란다.** 참조자료가 p0-planning/data/ 에 있는데 그 폴더는
      # 패키지 밖이라, 설치 방식에 따라 이미지 안에서 사라진다. import 는 멀쩡히 되고
      # 계획안을 만들 때 FileNotFoundError 로 죽는다 — 실제로 한 번 냈다.
      # 파일이 있는지가 아니라 **읽어지는지**를 본다.
      #
      # 검사 본문은 이미지 안의 파일로 둔다. 여기 python -c 로 여러 줄을 적으면
      # YAML 접기가 줄머리 공백을 남겨 IndentationError 가 난다 — 실제로 한 번 냈다.
      - name: 이미지가 참조자료를 읽나
        run: >-
          docker run --rm
          -e DATABASE_URL=postgresql+psycopg://x:x@127.0.0.1:1/x
          -e SECRET_KEY=ci-only-not-a-secret
          ssuksak-backend:ci python -m app.checks.references

  # 화면이 실제 API 를 타는지 본다 — 가입부터 관찰 기록까지(frontend/e2e). ADR-028.
  # 다른 job 은 백엔드와 화면을 따로 본다. 둘이 어긋나도(칸 이름·주소) 각자 통과한다.
  e2e:
    name: e2e (playwright)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: ssuksak
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: ssuksak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ssuksak -d ssuksak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ssuksak:ci-only-not-a-secret@localhost:5432/ssuksak
      SECRET_KEY: ci-only-not-a-secret
      LLM_MODE: mock
      # Next 가 /api/... 를 여기로 넘긴다(next.config.ts rewrites). **빌드 때 박힌다** —
      # 그래서 job 전체에 둔다. NEXT_PUBLIC_API_MOCKING 은 주지 않는다 = MSW 꺼짐.
      # 운영은 nginx 가 /api 를 나누지만, 같은 출처 /api 라는 점은 같다.
      FASTAPI_BASE_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:3000
      # 일부 E2E 는 화면 응답만 믿지 않고 문서 상태를 DB 에서 직접 읽는다
      # (frontend/e2e/routines.spec.ts 의 dbDocument). 위 DATABASE_URL 과 **같은 DB** 이지만
      # psycopg.connect 가 그대로 받는 문자열이라 `+psycopg` 를 붙이지 않는다.
      E2E_DATABASE_URL: postgresql://ssuksak:ci-only-not-a-secret@localhost:5432/ssuksak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # -e 로 깐다 — pytest job 과 같은 이유(mapping.py 가 저장소 경로로 양식 파일을 찾는다).
      - name: Install planning core
        working-directory: p0-planning
        run: pip install -e .
      - name: Install backend
        working-directory: backend
        run: pip install -e .
      - name: alembic upgrade head
        working-directory: backend
        run: alembic upgrade head
      # 여기서 막아야 Playwright 가 다섯 군데에서 한꺼번에 빨개지는 대신 원인이 한 줄로 나온다.
      # dbDocument 가 쓰는 것과 같은 python·같은 변수다. 주소와 비밀번호는 찍지 않는다.
      - name: E2E_DATABASE_URL 로 DB 를 읽을 수 있나
        run: python -c "import os,psycopg; print('documents rows:', psycopg.connect(os.environ['E2E_DATABASE_URL']).execute('select count(*) from documents').fetchone()[0])"
      # 뒤 step 에서도 살아 있게 nohup 으로 띄운다. 준비된 것을 본 뒤에만 넘어간다.
      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/e2e-backend.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health/ready && exit 0
            sleep 1
          done
          cat /tmp/e2e-backend.log
          exit 1
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: next build
        working-directory: frontend
        run: npm run build
      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/e2e-next.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null "$E2E_BASE_URL/login" && exit 0
            sleep 1
          done
          cat /tmp/e2e-next.log
          exit 1
      # 브라우저만 받는다(Playwright 서버, 버전 고정). `--with-deps` 의 apt 는 쓰지 않는다 — 러너에
      # 브라우저 부품이 이미 다 있고 없는 건 글꼴 9개뿐인데, 그 apt 가 가끔 5~13분 걸렸다(2026-11).
      - name: Install chromium
        working-directory: frontend
        run: npx playwright install chromium
      # 글꼴은 `--with-deps` 가 깔던 9개를 그대로 깐다. 구글 폰트를 막는 e2e(routines · home-record)가
      # 한글을 이 시스템 글꼴로 그려서, 다른 글꼴로 바꾸면 화면 폭이 달라져 결과가 바뀐다(#433).
      # .deb 를 캐시해 apt 미러는 캐시가 빌 때만 탄다. GitHub 은 7일 동안 안 쓴 캐시를 지운다.
      # key 에 OS 판을 넣는다 — ubuntu-latest 가 다음 판으로 옮겨 가면 옛 .deb 를 쓰지 않고 새로 받는다.
      - name: e2e 글꼴 캐시 key
        id: fonts
        run: echo "key=e2e-fonts-$(. /etc/os-release && echo "$ID-$VERSION_ID")-v1" >> "$GITHUB_OUTPUT"
      - name: e2e 글꼴 캐시
        uses: actions/cache@v4
        with:
          path: ~/e2e-fonts
          key: ${{ steps.fonts.outputs.key }}
      - name: e2e 글꼴
        working-directory: frontend
        run: |
          if ! ls ~/e2e-fonts/*.deb > /dev/null 2>&1; then
            mkdir -p ~/e2e-fonts
            sudo apt-get update
            (cd ~/e2e-fonts && apt-get download fonts-freefont-ttf fonts-ipafont-gothic fonts-tlwg-loma-otf \
              fonts-unifont fonts-wqy-zenhei xfonts-cyrillic xfonts-encodings xfonts-scalable xfonts-utils)
          fi
          sudo dpkg -i ~/e2e-fonts/*.deb > /dev/null
          # Playwright 가 새로 요구하는 부품이 생기면 여기서 멈춘다 — 위 목록과 key 의 v 를 같이 바꾼다.
          # 「Missing」에는 이미 깔렸는데 새 판이 있는 것(업그레이드)도 섞여 나와서, 정말 없는 것만 센다.
          # 시뮬레이션 자체가 실패해도(그 줄이 없는데 종료 코드가 0 이 아니면) 멈춘다.
          out=$(npx playwright install-deps --dry-run chromium 2>&1) && exit 0
          grep -q 'Missing system dependencies' <<< "$out" || { echo "$out"; exit 1; }
          missing=$(sed -n 's/^  //p' <<< "$out" | while read -r p; do dpkg -s "$p" > /dev/null 2>&1 || echo "$p"; done)
          [ -z "$missing" ] || { echo "Playwright 가 요구하는데 없는 패키지:"; echo "$missing"; exit 1; }
      - name: playwright
        working-directory: frontend
        run: npm run e2e
      - name: 실패 기록 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            /tmp/e2e-backend.log
            /tmp/e2e-next.log
          retention-days: 7
