# 위험 표시 낱말 (ADR-016 검열 2단).
#
# **버리는 목록이 아니다. 사람에게 보여주는 표시다.**
# 승인 채널 15곳에서 315건을 긁어 이 낱말들로 훑어 보니(2026-10-16) 적중 0 · 오탐 4 였다.
# 오탐 중 하나가 「젤리인 줄 알고 세제 삼켰을 때, 진짜 올바른 대처법」이다 —
# 탈락 규칙으로 켰으면 **아이에게 위험을 가르치는 영상이 제일 먼저 버려졌다.**
# 위험한 콘텐츠와 안전교육 콘텐츠는 같은 낱말을 쓴다. 글자로는 못 가른다 — 3단이 가른다.
#
# 그래도 목록을 둔다. 두 자리에서 필요해진다.
#   ① 승인 채널을 넓힐 때 — 기준이 느슨해지면 1단이 지금처럼 못 막는다
#   ② 뉴스에서 소재를 집을 때 — 「기절놀이 또 유행」 같은 기사가 들어오는 길이다
#
# 낱말은 지어내지 않는다. 출처가 있는 것만 적는다 (ADR-016:
# 「왜 걸렀나」를 설명할 수 없으면 검열이 아니라 취향이다).

sources:
  - name: 한국소비자원 어린이 안전사고 — 삼킴·흡인 52.9%, 완구 46.3%, 대형완구는 추락
    url: https://www.korea.kr/news/policyNewsView.do?newsId=148935834
  - name: 기절놀이 — 목을 조르거나 가슴을 눌러 실신시키는 놀이. 사망 사례
    url: https://www.khanews.com/news/articleView.html?idxno=23341

# 무리마다 왜 위험한지를 한 줄로 적는다. 교사에게 보여줄 때 그 줄을 그대로 쓴다.
groups:
  - name: 질식·기절
    why: 목을 조르거나 숨을 참게 하는 놀이. 뇌에 산소가 끊긴다
    words: [기절, 실신, 숨 참, 숨참, 목 조르, 목조르, 질식, 비닐봉지, 봉지를 쓰]
  - name: 추락
    why: 만 3~5세는 높이를 가늠하지 못한다. 대형완구 사고의 주된 유형이다
    words: [추락, 뛰어내리, 높은 곳, 옥상, 난간]
  - name: 삼킴·흡인
    why: 어린이 안전사고에서 가장 많다. 작은 부품을 식품으로 오인한다
    words: [삼키, 입에 넣, 입에 물, 코에 넣, 귀에 넣, 작은 부품, 식품모방]
  - name: 베임·찔림
    words: [뾰족, 송곳, 커터, 가위로 찌]
    why: 만든 것을 뾰족하게 남기는 활동이 있다
  - name: 화상·불
    why: 교실에서 불을 쓰는 활동
    words: [불을 붙, 라이터, 성냥, 폭죽, 촛불, 뜨거운 물]
  - name: 중독
    why: 세제·약을 식품으로 오인한다
    words: [표백, 세제, 약을 먹]
  - name: 익사·물
    why: 얕은 물에서도 일어난다
    words: [물에 빠, 익사, 욕조]
  - name: 따돌림·벌칙
    why: 다치지 않아도 상처가 남는다. 규칙에 벌칙이 끼어 있는 놀이
    words: [왕따, 따돌, 벌칙]
