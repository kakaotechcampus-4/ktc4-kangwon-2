# 이 파일을 고치는 PR 이 승인 절차다. 관리자 화면은 만들지 않는다.
# 목록에 없는 채널·언론사에서는 아예 긁어오지 않는다.
#
# 채널 ID 와 업로드 재생목록 ID 는 손으로 적지 않는다. 이렇게 뽑는다:
#     python backend/scripts/resolve_channels.py @ebskids @pinkfong ...
#
# 59개를 보고 15개를 골랐다 (2026-10-16). 고른 기준과 뺀 이유는
# docs/references/트렌드봇-채널-후보.md 에 있다.
#
# **대부분의 교사용 놀이 채널은 1~4년 전에 멈춰 있다.** 숫자를 채우려고
# 죽은 채널이나 장난감 개봉 채널을 넣지 않았다 — 검열 3단에서 떨어질 것만
# 늘리면 API 호출만 쓴다.
#
# 첫 수집 뒤 **건진 게 0건인 채널을 뺀다.** madeForKids 는 영상마다 붙어서
# 눈으로 못 가린다 (sources.py:_with_video_status).

