# 활동 재료·도구의 위험 표시 — 규칙 엔진의 safety 규칙이 읽는다 (ADR-005 개정판).
# activities.safety_flags (JSONB) 가 여기 최상위 키를 값으로 담는다.
#
# 왜 필요한가: 트렌드봇 승인 로직은 "성인 가요냐"를 걸러내지만 도구 위험은 걸러내지 않는다.
#
# ⚠ min_age 는 법이 정한 값이 아니다. 아동복지법 시행령 별표 6 은 안전"교육"의
#   주기·시수만 정하고, 도구별 사용 연령은 정하지 않는다. 누리과정 지도서에도 없다.
#   아래 숫자는 팀 판단이다 — 현직 교사 확인을 받은 뒤 이 주석을 지운다.
#   확인 전까지 safety 규칙은 "막는다"가 아니라 "교사에게 표시한다"로 쓴다.
#
# 키는 불변 슬러그다. 한 번 정하면 고치지 않는다 (activities 행이 이 값을 담는다).

scissors:
  label: 가위
  min_age: 4
  supervision: 교사 상시 관찰
  note: 유아용 안전가위 기준. 일반 가위는 교사가 직접 조작한다

glue_gun:
  label: 글루건
  min_age: 5
  supervision: 교사 직접 조작
  note: 고온. 유아가 잡지 않는다

hot_water:
  label: 뜨거운 물·열원
  min_age: 5
  supervision: 교사 직접 조작
  note: 요리 활동·촛불 포함

small_parts:
  label: 삼킴 위험 소품
  min_age: 4
  supervision: 교사 상시 관찰
  note: 지름 3cm 미만 구슬·단추·자석
