# LLM 전송용 가명 Pool (ADR-004).
#
# 아동 실명은 DB 에 저장하고, LLM 호출 직전에 여기 있는 이름으로 바꾼다.
# 응답을 화면에 뿌리기 전에 다시 실명으로 되돌린다.
# 치환은 shared/childCode 한 곳에서만 한다.
#
# 왜 받침으로 나누나
#   한국어 조사가 이름 마지막 글자의 받침에 붙는다.
#   받침이 다른 이름으로 바꾸면 복원할 때 조사가 틀어진다.
#
#     원본   박서준이 블록을 쌓았다      "준" 받침 ㄴ  -> 이
#     가명   민준서가 블록을 쌓았다      "서" 받침 X   -> 가
#     복원   박서준가 블록을 쌓았다      틀어졌다
#
#   그래서 원본 이름의 마지막 글자에 받침이 있으면 with_final 에서,
#   없으면 without_final 에서 뽑는다.
#
# 규칙 (api-spec §2-1)
#   - 실제 아동 이름에서 파생하지 않는다
#   - 같은 반 안에서 중복되지 않는다 — UNIQUE(class_id, code) 로 DB 가 지킨다
#   - 한 번 발급되면 그 아동이 삭제될 때까지 바꾸지 않는다
#   - 삭제된 아동의 code 는 재사용해도 된다
#
# 한 반 정원이 20명 안팎이라 각 30개면 넉넉하다. 모자라면 여기에 더 넣는다.
# 실제 아동 이름과 겹쳐도 문제 없다 — 이 목록은 아무 아동도 가리키지 않는다.

with_final:      # 받침 있음 — 조사 이/은/을/과/아
  - 민준
  - 서준
  - 예준
  - 도준
  - 건준
  - 도현
  - 지현
  - 예현
  - 시현
  - 유현
  - 지훈
  - 서훈
  - 다훈
  - 시원
  - 하원
  - 채원
  - 하은
  - 지은
  - 다은
  - 채은
  - 소은
  - 서율
  - 하율
  - 지율
  - 다진
  - 서진
  - 예진
  - 유진
  - 가람
  - 한솔

without_final:   # 받침 없음 — 조사 가/는/를/와/야
  - 서아
  - 지아
  - 채아
  - 시아
  - 리아
  - 건우
  - 시우
  - 도우
  - 지우
  - 민우
  - 윤하
  - 서하
  - 유하
  - 채하
  - 유나
  - 하나
  - 미나
  - 서나
  - 예서
  - 하서
  - 다서
  - 아리
  - 하리
  - 나리
  - 세리
  - 민호
  - 지호
  - 태호
  - 준호
  - 시후
