[project]
name = "ssuksak-backend"
version = "0.1.0"
description = "쓱싹요정 backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "alembic",
  "psycopg[binary]",
  "pydantic-settings",
  "pyhwp",
  "six",
  "olefile",
  "lxml",
  "python-multipart",
]

[project.optional-dependencies]
dev = ["ruff==0.16.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
