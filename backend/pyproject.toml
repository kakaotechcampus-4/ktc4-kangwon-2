[project]
name = "ssuksak-backend"
version = "0.1.0"
description = "쓱싹요정 backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "alembic",
  "psycopg[binary]",
  "pydantic-settings",
  # EmailStr. 이메일 형식을 정규식으로 직접 짜면 반드시 틀린다.
  "pydantic[email]",
  "pyhwp",
  "six",
  "olefile",
  "lxml",
  "python-multipart",
  # 트렌드 수집이 외부 API 를 부른다 (ADR-016).
  "httpx",
  # resources/rules/*.yaml 과 resources/pseudonyms.yaml 을 읽는다.
  "pyyaml",
  # 계획안 생성 로직. 같은 저장소의 별도 패키지다 — 서버는 이걸 부르기만 한다.
  "ssuksak-planning",
]

[tool.uv.sources]
ssuksak-planning = { path = "../p0-planning", editable = true }

[project.optional-dependencies]
dev = ["ruff==0.16.6", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
