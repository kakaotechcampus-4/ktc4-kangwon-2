[project]
name = "ssuksak-planning"
version = "0.1.0"
description = "Shared Planning Core foundation for Yearly, Monthly, and Weekly plans"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: opt-in test that may call an external provider"]
